project:
  name: rtagc_paper2
  random_seed: 20261008

dataset:
  raw_path: data/raw/Telco-Customer-Churn.csv
  target: Churn
  id_column: customerID

split:
  train: 0.70
  validation: 0.15
  test: 0.15
  stratify: true

models:
  logistic_regression:
    enabled: true
    max_iter: 2000
    class_weight: null
  random_forest:
    enabled: true
    n_estimators: 500
    min_samples_leaf: 2
    n_jobs: -1
  xgboost:
    enabled: true
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.9
    colsample_bytree: 0.9

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

governance:
  rules_path: governance/governance_rules.yaml
